<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Stylishthread · Sales & Profit</title>
<meta name="theme-color" content="#5E1538">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stylishthread">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%237A1F4B'/%3E%3Ctext x='31' y='41' text-anchor='middle' font-family='Georgia,serif' font-size='25' font-weight='700' fill='%23fff'%3ES%3Ctspan fill='%23F0CD85'%3ET%3C/tspan%3E%3C/text%3E%3C/svg%3E">
<style>
:root{
  --wine:#7A1F4B; --wine-d:#5E1538; --wine-50:#F7EEF2; --wine-100:#EEDCE5;
  --gold:#C9973F; --gold-l:#F0CD85;
  --bg:#F6F3F1; --card:#fff; --ink:#1E1A22; --ink2:#4A4450; --muted:#6B6470; --line:#E6E0E3;
  --ok:#14724A; --ok-bg:#E5F3EB; --due:#B42318; --due-bg:#FCEDEB; --warn:#8A5A00;
  --r:12px; --sh:0 1px 2px rgba(30,26,34,.05),0 3px 10px rgba(30,26,34,.04);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--font);padding-bottom:calc(128px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.wrap{max-width:620px;margin:0 auto;padding:0 10px}

/* header */
.top{background:linear-gradient(135deg,#86245A,var(--wine-d));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(60,10,35,.22)}
.top .wrap{display:flex;align-items:center;gap:9px;height:52px}
.logo{width:34px;height:34px;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font:700 17px/1.1 var(--serif);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:10.5px;opacity:.85;letter-spacing:.3px}
.sync{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:5px 10px;font-size:11.5px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:#5BD08F;flex:none}
.sync.busy i{background:var(--gold-l);animation:pulse 1s infinite}
.sync.warn i{background:#FFB547}
@keyframes pulse{50%{opacity:.3}}

/* tabs: bottom bar on phones, top bar on bigger screens */
.tabs{background:var(--card);position:fixed;left:0;right:0;bottom:0;z-index:15;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.tabs .wrap{display:flex;padding:0}
.tab{flex:1;border:0;background:none;color:var(--muted);font-weight:600;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px 7px;border-top:2.5px solid transparent;position:relative}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--wine);border-top-color:var(--wine)}
.badge{background:var(--due);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;font-weight:700;min-width:16px;text-align:center;position:absolute;top:3px;left:calc(50% + 6px)}
.badge:empty{display:none}
@media (min-width:760px){
  body{padding-bottom:100px}
  .tabs{position:sticky;top:52px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);box-shadow:none;padding:0}
  .tab{flex-direction:row;gap:7px;font-size:13.5px;padding:10px;border-top:0;border-bottom:2.5px solid transparent;max-width:180px;margin:0 auto}
  .tab.on{border-bottom-color:var(--wine)}
  .badge{position:static}
}

/* views & cards */
.view{display:none;padding:10px 0}
.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px;margin-bottom:10px}
.card h2,.h2{font-size:13.5px;margin:0 0 9px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.h2 .sub,h2 .sub{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
.grid{display:grid;gap:9px;grid-template-columns:1fr 1fr}
.cust{grid-column:span 2}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12px;font-weight:600;color:var(--ink2)}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:#FCFBFA;border-radius:9px;padding:8px 10px;outline:none;min-height:40px;font-size:15px}
textarea{min-height:56px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--wine);box-shadow:0 0 0 3px rgba(122,31,75,.12);background:#fff}
input.bad{border-color:var(--due);background:var(--due-bg)}
input[type=date].notToday{border-color:var(--gold);background:#FFF8E8}
.hint{font-size:11px;color:var(--warn);font-weight:600;font-style:normal}
.phone{display:flex;border:1.5px solid var(--line);border-radius:9px;background:#FCFBFA;overflow:hidden}
.phone:focus-within{border-color:var(--wine);box-shadow:0 0 0 3px rgba(122,31,75,.12)}
.phone .cc{display:grid;place-items:center;padding:0 9px;background:var(--wine-50);color:var(--wine);font-weight:700;font-size:14px;border-right:1.5px solid var(--line)}
.phone input{border:0;border-radius:0;box-shadow:none!important;min-width:0}
.phone input.bad{background:var(--due-bg)}
.editbar{display:flex;align-items:center;gap:8px;background:#FFF3D9;border:1px solid #F0D49A;color:#6B4600;border-radius:10px;padding:8px 10px;margin-bottom:10px;font-weight:700;font-size:13px}
.editbar span{flex:1}

/* item rows */
.item{border:1.5px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;background:#FFFEFD}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;min-height:24px}
.item-no{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--wine)}
.icon-btn{border:0;background:var(--wine-50);color:var(--wine);width:28px;height:28px;border-radius:7px;font-size:12px}
.stepper{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:#FCFBFA;height:40px}
.stepper button{border:0;background:var(--wine-50);color:var(--wine);width:38px;font-size:18px;font-weight:600;flex:none}
.stepper input{border:0;border-radius:0;text-align:center;min-width:0;background:transparent;box-shadow:none!important;min-height:0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.item-profit{margin-top:7px;font-size:12px;color:var(--muted)}
.item-profit b{color:var(--ok)}
.item-profit b.neg{color:var(--due)}
.add-item{width:100%;border:1.5px dashed #CDB6C2;background:var(--wine-50);color:var(--wine);border-radius:10px;padding:9px;font-weight:700;font-size:13px}

/* customer suggestions */
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 3px);background:#fff;border:1.5px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(30,26,34,.16);z-index:30;max-height:260px;overflow:auto;padding:3px}
.ac-list button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px}
.ac-list button span{color:var(--muted);font-size:12px;white-space:nowrap}
.ac-list button span.nm{color:var(--ink);font-size:14px;white-space:normal;min-width:0}
.ac-list button.on,.ac-list button:active,.ac-list button:hover{background:var(--wine-50)}
.ac-list b{color:var(--wine)}
input.auto{background:#F2F8F4}

/* paid switch */
.switch{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;user-select:none;background:#FCFBFA}
.switch input{display:none}
.switch .tr{width:40px;height:24px;border-radius:999px;background:#D7CFD3;position:relative;flex:none;transition:.15s}
.switch .tr:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.switch input:checked+.tr{background:var(--ok)}
.switch input:checked+.tr:after{left:19px}
.switch b{display:block;font-size:13.5px}
.switch small{color:var(--muted);font-size:11.5px}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));z-index:14;background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -3px 12px rgba(30,26,34,.07)}
.savebar .wrap{display:flex;align-items:center;gap:10px;padding-top:7px;padding-bottom:7px}
.savebar .tot{flex:1;min-width:0}
.savebar .tot b{font-size:17px;display:block;line-height:1.15}
.savebar .tot span{font-size:11.5px;color:var(--muted)}
.savebar .tot span em{font-style:normal;color:var(--ok);font-weight:700}
@media (min-width:760px){.savebar{bottom:0}.savebar .wrap{padding-bottom:calc(8px + env(safe-area-inset-bottom))}}
.btn{border:0;background:var(--wine);color:#fff;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14.5px;box-shadow:0 2px 8px rgba(122,31,75,.28);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:translateY(1px)}
.btn.lite{background:var(--wine-50);color:var(--wine);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
body:not(.v-sale) .savebar{display:none}

/* orders */
.toolbar{display:flex;gap:6px;margin-bottom:8px}
.search{position:relative;flex:1}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.filters{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.filters select{width:auto;min-height:32px;padding:4px 8px;border-radius:999px;font-weight:600;font-size:12.5px}
.due-banner{display:flex;align-items:center;gap:10px;background:var(--due-bg);border:1px solid #F3C6C0;border-radius:var(--r);padding:9px 11px;margin-bottom:8px}
.due-banner .dt{flex:1}
.due-banner b{color:var(--due);font-size:15px;display:block}
.due-banner span{font-size:11.5px;color:var(--ink2)}
.modeline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin:0 0 8px;font-weight:600}
.modeline button{margin-left:auto}
.cust-h{display:flex;align-items:center;gap:6px;margin:12px 0 6px;font-size:12px;color:var(--ink2)}
.cust-h b{color:var(--ink);font-size:13.5px}
.cust-h .ghost{margin-left:auto}
.order{background:var(--card);border:1px solid var(--line);border-left:3.5px solid var(--due);border-radius:10px;padding:9px 11px;margin-bottom:8px;box-shadow:var(--sh)}
.order.paid{border-left-color:var(--ok)}
.o-top{display:flex;gap:8px;justify-content:space-between}
.o-cust{font-weight:700;font-size:14px}
.o-meta{font-size:11.5px;color:var(--muted)}
.o-meta .sync-tag{color:var(--warn);font-weight:700}
.o-amt{text-align:right;white-space:nowrap}
.o-amt b{font-size:14.5px}
.o-amt div{font-size:11px;color:var(--ok);font-weight:600}
.o-items{font-size:12.5px;color:var(--ink2);margin:4px 0 7px}
.o-items span{color:var(--muted)}
.o-actions{display:flex;gap:5px;align-items:center}
.paybox{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #EDB4AD;background:var(--due-bg);color:var(--due);border-radius:8px;padding:5px 9px;font-weight:700;font-size:12px;white-space:nowrap}
.paybox .bx{width:15px;height:15px;border:2px solid currentColor;border-radius:4px;display:grid;place-items:center;background:#fff;flex:none}
.paybox.on{border-color:#9FD3B6;background:var(--ok-bg);color:var(--ok)}
.paybox.on .bx{background:var(--ok);border-color:var(--ok)}
.paybox.on .bx:after{content:"";width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ghost{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-weight:600;font-size:12px;color:var(--ink2);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.ghost svg{width:14px;height:14px}
.ghost.ed{margin-left:auto;color:var(--wine);border-color:var(--wine-100)}
.ghost.del{color:var(--muted);border-color:transparent;padding-left:5px;padding-right:5px}
.ghost.del:active,.ghost.del:hover{color:var(--due)}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:13px}
.more{display:block;margin:6px auto 0}

/* report */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;box-shadow:var(--sh)}
.kpi span{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi b{display:block;font-size:17px;margin-top:1px;font-variant-numeric:tabular-nums}
.kpi small{font-size:11px;color:var(--muted)}
.kpi.hero{background:linear-gradient(135deg,#86245A,var(--wine-d));color:#fff;border:0}
.kpi.hero span,.kpi.hero small{color:rgba(255,255,255,.82)}
.kpi.due b{color:var(--due)}
.chart{position:relative;height:150px;margin:6px 0 0 38px}
.grid-l{position:absolute;left:0;right:0;border-top:1px dashed #E8E2E5}
.grid-l span{position:absolute;right:calc(100% + 6px);top:-7px;font-size:10px;color:var(--muted);white-space:nowrap}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid #CFC7CB}
.bar{flex:1;height:100%;display:flex;align-items:flex-end;background:none;border:0;padding:0;min-width:0}
.bar i{display:block;width:100%;max-width:18px;margin:0 auto;background:var(--wine);border-radius:3px 3px 0 0}
.bar:hover i,.bar:focus i{background:#A13A6E}
.bar.today i{background:var(--gold)}
.xl{display:flex;margin:3px 0 0 38px;font-size:10px;color:var(--muted)}
.xl span{flex:1;text-align:center;min-width:0}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:11.5px;padding:5px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:3}
.tip.on{opacity:1}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:5px;border-bottom:1px solid var(--line)}
td{padding:7px 5px;border-bottom:1px solid #F0EBEE;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.share{height:5px;border-radius:3px;background:var(--wine);margin-top:4px;opacity:.85}
.two{display:grid;grid-template-columns:1fr;gap:0}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:grid;gap:6px;width:min(420px,92vw);pointer-events:none}
body:not(.v-sale) #toast{bottom:calc(64px + env(safe-area-inset-bottom))}
.t{background:var(--ink);color:#fff;border-radius:10px;padding:9px 12px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.22);animation:tin .2s ease}
.t.ok{background:var(--ok)}.t.err{background:var(--due)}.t.warn{background:#7A5200}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body class="v-sale">

<header class="top">
  <div class="wrap">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A3326B"/><stop offset="1" stop-color="#4F0F30"/></linearGradient></defs><circle cx="32" cy="32" r="31" fill="url(#lg)" stroke="#F0CD85" stroke-width="1.4"/><circle cx="32" cy="32" r="25.5" fill="none" stroke="#F0CD85" stroke-width="1.1" stroke-dasharray="2.4 2.2" opacity=".9"/><text x="31.5" y="40" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="700" fill="#fff" letter-spacing="-.5">S<tspan fill="#F0CD85">T</tspan></text><path d="M18 45.5c8 4.4 20.5 4.6 28.5-1.2" fill="none" stroke="#F0CD85" stroke-width="1.4" stroke-linecap="round"/><path d="M44.5 42l6 4.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
    <div class="brand"><b>Stylishthread</b><small>Sales &amp; Profit Book</small></div>
    <button class="sync" id="sync" title="Tap to sync now"><i></i><span>…</span></button>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="wrap">
    <button class="tab on" data-view="sale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>New Sale</button>
    <button class="tab" data-view="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Orders<span class="badge" id="dueBadge"></span></button>
    <button class="tab" data-view="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</button>
  </div>
</nav>

<main class="wrap">
  <!-- ============ NEW SALE ============ -->
  <section class="view on" id="v-sale">
    <div class="editbar" id="editBar" hidden><span id="editTxt">Editing</span><button class="ghost" id="cancelEdit">Cancel</button></div>
    <div class="card">
      <h2>Customer</h2>
      <div class="grid">
        <div class="f cust"><label for="cName" style="font-size:12px;font-weight:600;color:var(--ink2)">Customer name *</label><div class="ac"><input id="cName" autocomplete="off" autocapitalize="words" placeholder="Type name…" role="combobox" aria-autocomplete="list" aria-controls="acList"><div class="ac-list" id="acList" role="listbox" hidden></div></div></div>
        <div class="f"><label for="cPhone" style="font-size:12px;font-weight:600;color:var(--ink2)">Phone</label><div class="phone"><span class="cc">+91</span><input id="cPhone" type="tel" inputmode="numeric" autocomplete="off" placeholder="10 digits"></div></div>
        <label class="f"><span>Sale date</span><input id="cDate" type="date"><em class="hint" id="dateHint" hidden>Not today</em></label>
      </div>
    </div>

    <div class="card">
      <h2>Items <span class="sub" id="itemCount"></span></h2>
      <div id="items"></div>
      <button type="button" class="add-item" id="addItem">+ Add another item to this order</button>
    </div>

    <div class="card">
      <label class="switch"><input type="checkbox" id="cPaid"><span class="tr"></span><span><b id="paidLbl">Payment not received</b><small>Turn on if already paid</small></span></label>
      <label class="f" style="margin-top:9px"><span>Notes</span><input id="cNotes" placeholder="Courier, size, address, etc."></label>
    </div>

    <div class="card">
      <h2>Today's entries <span class="sub" id="todaySum"></span></h2>
      <div id="recent"></div>
    </div>
  </section>

  <!-- ============ ORDERS ============ -->
  <section class="view" id="v-orders">
    <div class="due-banner" id="dueBanner" hidden>
      <div class="dt"><b id="dueAmt">₹0</b><span id="dueTxt">pending</span></div>
      <button class="btn sm" id="showDue">View unpaid</button>
    </div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search name, phone, order no, item…" autocomplete="off" enterkeyhint="search"></div>
      <button class="btn sm lite" id="searchAll" title="Search in every month">All months</button>
    </div>
    <div class="filters" id="filters">
      <select id="oMonth" aria-label="Month"></select>
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="due">Unpaid</button>
      <button class="chip" data-f="paid">Paid</button>
    </div>
    <div class="modeline" id="modeline" hidden></div>
    <div id="olist"></div>
  </section>

<div id="toast" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   ✏️  EDIT THESE 3 SETTINGS
   ===================================================================== */

// 1) Google Sheet link: Apps Script → Deploy → Web app URL (ends with /exec)
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyJpQS6tk3n0mhJGT4-qYA-OTG7tgZqY_AVMDZDZlyDkWzNlDxwzaK9RSe6U3uky9eC/exec';

// 2) UPI ID shown in WhatsApp reminders & bills (leave '' to hide it)
const UPI_ID = 'sonalagarwal0504-1@okhdfcbank';

// 3) Item types shown in the "Item type" dropdown (add / remove / reorder freely)
const ITEM_TYPES = [
  'Saree',
  'Kurti',
  'Suit / Dress material',
  'Dress / Gown',
  'Top / Tunic',
  'Lehenga',
  'Dupatta / Stole',
  'Bottom wear',
  'Jewellery',
  'Bag',
  'Footwear',
  'Kids wear',
  'Other'
];
/* ===================================================================== */

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LS = {cache:'st_cache_v1', out:'st_outbox_v1', cust:'st_customers_v1'};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthOf = ds => { const [y, m] = String(ds).split('-'); return MONTHS[+m - 1] + ' ' + y; };
const curMonth = () => monthOf(today());
const mIdx = name => { const [m, y] = name.split(' '); return +y * 12 + MONTHS.indexOf(m); };
const nowTime = () => new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:true}).toUpperCase();
const NF = new Intl.NumberFormat('en-IN', {maximumFractionDigits: 2});
const inr = n => '₹' + NF.format(Math.round((+n || 0) * 100) / 100);
const inr0 = n => '₹' + Math.round(+n || 0).toLocaleString('en-IN');
const num = v => { const n = parseFloat(String(v ?? '').replace(/[₹,\s]/g, '')); return isFinite(n) ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtD = ds => { if (!/^\d{4}-\d{2}-\d{2}$/.test(ds || '')) return ds || ''; const [, m, d] = ds.split('-'); return `${+d} ${MONTHS[+m - 1]}`; };
const oNum = o => parseInt(String(o || '').replace(/\D/g, ''), 10) || 0;
function load(k, def) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch (e) { return def; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ---------------- state ---------------- */
const cfg = {url: /^https:\/\/script\.google(usercontent)?\.com\//.test(SHEET_URL.trim()) ? SHEET_URL.trim() : '', upi: UPI_ID.trim()};
let cache = Object.assign({months:[], data:{}, pending:[], ts:{}}, load(LS.cache, {}));
let outbox = load(LS.out, []); if (!Array.isArray(outbox)) outbox = [];
const S = {view:'sale', items:[blankItem()], oMonth:curMonth(), oMode:'month', oFilter:'all', q:'', searchRows:[], searching:false,
           rMonth:curMonth(), limit:60, flushing:false, refreshing:0, lastWrite:0, retryT:0};
const cats = () => ITEM_TYPES.map(s => String(s).trim()).filter(Boolean);
function blankItem() { return {item:'', category:'', qty:1, cost:'', sell:''}; }

function saveCache() {
  const keep = new Set([curMonth(), S.oMonth, S.rMonth, ...Object.keys(cache.data).sort((a, b) => mIdx(b) - mIdx(a)).slice(0, 3)]);
  for (const k of Object.keys(cache.data)) if (!keep.has(k)) { delete cache.data[k]; delete cache.ts[k]; }
  store(LS.cache, cache);
}
const saveOut = () => store(LS.out, outbox);

/* ---------------- server ---------------- */
async function api(action, data = {}, ms = 25000) {
  if (!cfg.url) throw Object.assign(new Error('Google Sheet link missing – paste SHEET_URL at the top of index.html'), {code:'NO_URL'});
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  let res;
  try {
    res = await fetch(cfg.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action}, data)), signal: ctl.signal});
  } catch (e) { throw Object.assign(new Error('No internet / Google not reachable'), {net:true}); }
  finally { clearTimeout(t); }
  let j;
  try { j = await res.json(); }
  catch (e) { throw Object.assign(new Error('Google sent an unexpected reply – check the Web App URL and that access is "Anyone"'), {code:'BAD_URL'}); }
  if (!j.ok) throw Object.assign(new Error(j.error || 'Server error'), {code: j.code || 'SERVER'});
  return j;
}

function handleErr(e, quiet) {
  if (e.code === 'NO_URL') { if (!quiet) toast(e.message, 'warn'); }
  else if (e.net) { if (!quiet) toast('Offline – entries are kept on this phone and will sync automatically', 'warn'); }
  else toast(e.message, 'err');
}

/* ---------------- local data helpers ---------------- */
const okey = r => r.id || (r.s + '|' + r.o);
const lists = () => [...Object.values(cache.data), cache.pending, S.searchRows];
function rowsFromOrder(o) {
  const s = monthOf(o.date);
  return o.items.map(it => ({s, o:o.orderNo || '', id:o.id, d:o.date, t:o.time, c:o.customer, p:o.phone, i:it.item, g:it.category,
    q:it.qty, cp:it.cost, sp:it.sell, pd:!!o.paid, po:o.paid ? today() : '', n:o.notes, sync:o.orderNo ? undefined : 1}));
}
function addLocal(rows) {
  const s = rows[0].s, id = rows[0].id;
  const arr = cache.data[s] || (cache.data[s] = []);
  if (!arr.some(r => r.id === id)) arr.push(...rows.map(r => ({...r})));
  if (!rows[0].pd && !cache.pending.some(r => r.id === id)) cache.pending.push(...rows.map(r => ({...r})));
  if (!cache.months.includes(s)) { cache.months.push(s); cache.months.sort((a, b) => mIdx(b) - mIdx(a)); }
}
function findRows(key) {
  for (const l of lists()) { const f = l.filter(r => okey(r) === key); if (f.length) return f; }
  return [];
}
function setPaidLocal(key, paid) {
  const src = findRows(key).map(r => ({...r}));
  for (const l of lists()) for (const r of l) if (okey(r) === key) { r.pd = paid; r.po = paid ? today() : ''; }
  if (paid) cache.pending = cache.pending.filter(r => okey(r) !== key);
  else if (!cache.pending.some(r => okey(r) === key)) cache.pending.push(...src.map(r => ({...r, pd:false, po:''})));
}
function removeLocal(key) {
  for (const k of Object.keys(cache.data)) cache.data[k] = cache.data[k].filter(r => okey(r) !== key);
  cache.pending = cache.pending.filter(r => okey(r) !== key);
  S.searchRows = S.searchRows.filter(r => okey(r) !== key);
}
function applyOrderNo(id, no) {
  for (const l of lists()) for (const r of l) if (r.id === id) { r.o = no; delete r.sync; }
}
function mergeUnsynced() {
  for (const j of outbox) {
    if (j.op === 'add') addLocal(rowsFromOrder(j.order));
    else if (j.op === 'edit') { removeLocal(j.key); removeLocal(j.order.id); addLocal(rowsFromOrder(j.order)); }
    else if (j.op === 'paid') setPaidLocal(j.key, j.paid);
  }
}
function group(rows) {
  const m = new Map();
  for (const r of rows) {
    const k = okey(r);
    let o = m.get(k);
    if (!o) { o = {key:k, s:r.s, o:r.o, id:r.id, d:r.d, t:r.t, c:r.c, p:r.p, n:r.n, pd:true, sync:r.sync, items:[], sale:0, cost:0, qty:0}; m.set(k, o); }
    o.items.push(r); o.sale += r.q * r.sp; o.cost += r.q * r.cp; o.qty += r.q;
    if (!r.pd) o.pd = false;
  }
  return [...m.values()].sort((a, b) => (b.sync ? 1 : 0) - (a.sync ? 1 : 0) || (b.d > a.d ? 1 : b.d < a.d ? -1 : 0) || oNum(b.o) - oNum(a.o));
}

/* ---------------- sync engine ---------------- */
async function flush() {
  if (S.flushing || !outbox.length || !cfg.url) { setSync(); return; }
  S.flushing = true; setSync();
  try {
    while (outbox.length) {
      const job = outbox[0];
      if (job.op === 'add') {
        const sent = job.order, sentPaid = !!job.order.paid;
        const r = await api('addOrder', {order: job.order});
        outbox = outbox.filter(j => j !== job);
        applyOrderNo(job.order.id, r.orderNo);
        if (job.order !== sent) { // edited while it was being sent
          job.order.orderNo = r.orderNo;
          outbox.push({op:'edit', key:job.order.id, sheet:r.sheet, orderNo:r.orderNo, order:job.order});
        } else if (!!job.order.paid !== sentPaid) outbox.push({op:'paid', key:job.order.id, sheet:r.sheet, orderNo:r.orderNo, paid:!!job.order.paid});
        toast(`Order ${r.orderNo} saved to sheet ✓`, 'ok');
      } else if (job.op === 'edit') {
        try { await api('updateOrder', {sheet:job.sheet, orderNo:job.orderNo, order:job.order}); toast(`Order ${job.orderNo} updated in sheet ✓`, 'ok'); }
        catch (e) { if (e.net || e.code === 'NO_URL' || e.code === 'BAD_URL') throw e; toast(e.message, 'err'); }
        outbox = outbox.filter(j => j !== job);
      } else if (job.op === 'paid') {
        try { await api('setPaid', {sheet:job.sheet, orderNo:job.orderNo, paid:job.paid}); }
        catch (e) { if (e.net || e.code === 'NO_URL' || e.code === 'BAD_URL') throw e; toast(e.message, 'err'); }
        outbox = outbox.filter(j => j !== job);
      } else outbox = outbox.filter(j => j !== job);
      S.lastWrite = Date.now(); saveOut(); saveCache(); renderAll();
    }
  } catch (e) {
    if (e.net) { clearTimeout(S.retryT); S.retryT = setTimeout(flush, 15000); }
    handleErr(e, true);
  } finally { S.flushing = false; setSync(); }
}

async function refresh(month = curMonth()) {
  if (!cfg.url) { setSync(); return; }
  const started = Date.now(); S.refreshing++; setSync();
  try {
    const r = await api('bootstrap', {month});
    cache.months = r.months; cache.data[month] = r.rows; cache.pending = r.pending; cache.ts[month] = Date.now();
    if (Array.isArray(r.customers)) { for (const c of r.customers) rememberCustomer(c.n, c.p, c.t || 0); saveCust(); }
    mergeUnsynced(); saveCache(); fillDatalists(); renderAll();
    if (S.lastWrite > started) setTimeout(() => refresh(month), 400);
  } catch (e) { handleErr(e, true); }
  finally { S.refreshing--; setSync(); }
}

async function loadMonth(m) {
  if (m === curMonth()) return refresh(m);
  if (!cfg.url) return;
  S.refreshing++; setSync();
  try { const r = await api('month', {month:m}); cache.data[m] = r.rows; cache.ts[m] = Date.now(); mergeUnsynced(); saveCache(); renderAll(); }
  catch (e) { handleErr(e, true); }
  finally { S.refreshing--; setSync(); }
}
const ensureMonth = m => { if (!cache.ts[m] || Date.now() - cache.ts[m] > 60000) loadMonth(m); };

function setSync() {
  const el = $('#sync'), n = outbox.length;
  el.className = 'sync';
  let txt;
  if (!cfg.url) { el.classList.add('warn'); txt = 'Not connected'; }
  else if (S.flushing) { el.classList.add('busy'); txt = `Saving ${n}…`; }
  else if (n) { el.classList.add('warn'); txt = `${n} waiting · retry`; }
  else if (S.refreshing) { el.classList.add('busy'); txt = 'Updating…'; }
  else txt = 'Synced';
  el.lastChild.textContent = txt;
}

/* ---------------- toast ---------------- */
function toast(msg, type = '') {
  const t = document.createElement('div'); t.className = 't ' + type; t.textContent = msg;
  const box = $('#toast'); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), type === 'err' ? 5000 : 2600);
}

/* ================= NEW SALE ================= */
const local10 = p => { let d = String(p || '').replace(/\D/g, ''); if (d.length > 10) d = d.slice(-10); return d; };
const fullPhone = d => d ? '+91' + d : '';
const showPhone = p => { const d = local10(p); return d ? `+91 ${d.slice(0, 5)} ${d.slice(5)}` : ''; };
function catOptions(sel) {
  const list = cats(); if (sel && !list.includes(sel)) list.push(sel);
  return `<option value="">Choose…</option>` + list.map(c => `<option${c === sel ? ' selected' : ''}>${esc(c)}</option>`).join('');
}
function itemCard(it, k) {
  return `<div class="item" data-k="${k}">
    <div class="item-head"><span class="item-no">Item ${k + 1}${it.item ? ` · ${esc(it.item)}` : ''}</span>${S.items.length > 1 ? '<button type="button" class="icon-btn" data-act="rm" aria-label="Remove item">✕</button>' : ''}</div>
    <div class="grid">
      <label class="f"><span>Item type</span><select data-f="category">${catOptions(it.category)}</select></label>
      <div class="f"><span>Qty</span><div class="stepper"><button type="button" data-act="dec" aria-label="Less">−</button><input data-f="qty" inputmode="numeric" value="${esc(it.qty)}" aria-label="Quantity"><button type="button" data-act="inc" aria-label="More">+</button></div></div>
      <label class="f"><span>Cost price ₹ *</span><input data-f="cost" inputmode="decimal" value="${esc(it.cost)}" placeholder="Per piece"></label>
      <label class="f"><span>Selling price ₹ *</span><input data-f="sell" inputmode="decimal" value="${esc(it.sell)}" placeholder="Per piece"></label>
    </div>
    <div class="item-profit" data-profit></div>
  </div>`;
}
function renderItems() {
  $('#items').innerHTML = S.items.map(itemCard).join('');
  updateSums();
}
function updateSums() {
  let sale = 0, cost = 0, qty = 0;
  S.items.forEach((it, k) => {
    const q = num(it.qty) || 1, c = num(it.cost), s = num(it.sell);
    sale += q * s; cost += q * c; qty += q;
    const el = $(`.item[data-k="${k}"] [data-profit]`);
    if (el) {
      if (s > 0) { const p = (s - c) * q; el.innerHTML = `Amount <b style="color:var(--ink)">${inr(q * s)}</b> · Profit <b class="${p < 0 ? 'neg' : ''}">${inr(p)}</b>${c > 0 ? ` (${Math.round((s - c) / c * 100)}%)` : ''}`; }
      else el.textContent = 'Enter cost & selling price to see profit';
    }
  });
  $('#sumSale').textContent = inr(sale);
  $('#sumMeta').innerHTML = `${qty} pc · Profit <em${sale - cost < 0 ? ' style="color:var(--due)"' : ''}>${inr(sale - cost)}</em>`;
  $('#itemCount').textContent = S.items.length > 1 ? `${S.items.length} items` : '';
}
$('#items').addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f) return;
  const k = +e.target.closest('.item').dataset.k;
  S.items[k][f] = e.target.value; e.target.classList.remove('bad');
  updateSums();
});
$('#items').addEventListener('change', e => { if (e.target.dataset.f === 'category') { S.items[+e.target.closest('.item').dataset.k].category = e.target.value; } });
$('#items').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const card = b.closest('.item'), k = +card.dataset.k, it = S.items[k];
  const act = b.dataset.act;
  if (act === 'rm') { S.items.splice(k, 1); renderItems(); return; }
  if (act === 'inc' || act === 'dec') { it.qty = Math.max(1, (num(it.qty) || 1) + (act === 'inc' ? 1 : -1)); card.querySelector('[data-f=qty]').value = it.qty; }
  updateSums();
});
$('#addItem').onclick = () => {
  S.items.push(blankItem()); renderItems();
  const last = $$('.item').pop(); last.scrollIntoView({behavior:'smooth', block:'center'}); last.querySelector('[data-f=category]').focus({preventScroll:true});
};
$('#cPaid').onchange = e => { $('#paidLbl').textContent = e.target.checked ? 'Payment received ✓' : 'Payment not received'; };
$('#cDate').oninput = () => { const nt = $('#cDate').value !== today(); $('#cDate').classList.toggle('notToday', nt); $('#dateHint').hidden = !nt; };

/* ---- customer name suggestions + phone auto-fill ---- */
const AC = {items:[], idx:-1};
function fillPhoneFor(name) {
  const c = custDir[name.trim().toLowerCase()], ph = $('#cPhone');
  if (c && c.p) { if (!ph.value || ph.dataset.auto) { ph.value = local10(c.p); ph.dataset.auto = '1'; ph.classList.add('auto'); } }
  else if (ph.dataset.auto) { ph.value = ''; delete ph.dataset.auto; ph.classList.remove('auto'); }
}
function showSuggestions() {
  const q = $('#cName').value.trim().toLowerCase(), box = $('#acList');
  if (!q) { box.hidden = true; AC.items = []; return; }
  const all = Object.values(custDir);
  const starts = [], words = [], has = [];
  for (const c of all) {
    const n = c.n.toLowerCase();
    if (n === q) continue; // already typed in full
    if (n.startsWith(q)) starts.push(c); else if (n.split(/\s+/).some(w => w.startsWith(q))) words.push(c); else if (n.includes(q) || (c.p && c.p.includes(q))) has.push(c);
  }
  const byRecent = (a, b) => (b.t || 0) - (a.t || 0);
  AC.items = [...starts.sort(byRecent), ...words.sort(byRecent), ...has.sort(byRecent)].slice(0, 7);
  AC.idx = -1;
  if (!AC.items.length) { box.hidden = true; return; }
  const hl = n => { const i = n.toLowerCase().indexOf(q); return i < 0 ? esc(n) : esc(n.slice(0, i)) + '<b>' + esc(n.slice(i, i + q.length)) + '</b>' + esc(n.slice(i + q.length)); };
  box.innerHTML = AC.items.map((c, i) => `<button type="button" role="option" data-i="${i}"><span class="nm">${hl(c.n)}</span><span>${esc(showPhone(c.p) || 'no number')}</span></button>`).join('');
  box.hidden = false;
}
function pickSuggestion(i) {
  const c = AC.items[i]; if (!c) return;
  $('#cName').value = c.n; $('#acList').hidden = true;
  fillPhoneFor(c.n); $('#cName').classList.remove('bad');
  $('#cName').blur();
}
$('#cName').addEventListener('input', () => { $('#cName').classList.remove('bad'); fillPhoneFor($('#cName').value); showSuggestions(); });
$('#cName').addEventListener('focus', showSuggestions);
$('#cName').addEventListener('blur', () => setTimeout(() => { $('#acList').hidden = true; }, 150));
$('#cName').addEventListener('keydown', e => {
  const box = $('#acList'); if (box.hidden || !AC.items.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); AC.idx = (AC.idx + (e.key === 'ArrowDown' ? 1 : -1) + AC.items.length) % AC.items.length;
    [...box.children].forEach((b, i) => b.classList.toggle('on', i === AC.idx));
  } else if (e.key === 'Enter' && AC.idx > -1) { e.preventDefault(); pickSuggestion(AC.idx); }
  else if (e.key === 'Escape') box.hidden = true;
});
$('#acList').addEventListener('pointerdown', e => { const b = e.target.closest('[data-i]'); if (b) { e.preventDefault(); pickSuggestion(+b.dataset.i); } });
// phone: only 10 digits after the fixed +91 (pasting "+91 98765 43210" or "098765..." also works)
$('#cPhone').addEventListener('input', e => {
  const el = e.target; let d = el.value.replace(/\D/g, '');
  if (d.length > 10 && d.startsWith('91')) d = d.slice(2);
  if (d.length > 10 && d.startsWith('0')) d = d.slice(1);
  el.value = d.slice(0, 10);
  delete el.dataset.auto; el.classList.remove('auto', 'bad');
});

function resetForm() {
  S.items = [blankItem()]; renderItems();
  const ph = $('#cPhone');
  $('#cName').value = ''; ph.value = ''; delete ph.dataset.auto; ph.classList.remove('auto', 'bad'); $('#cNotes').value = '';
  $('#cPaid').checked = false; $('#cPaid').onchange({target:$('#cPaid')});
}

function saveSale() {
  const name = $('#cName').value.trim(), phone = local10($('#cPhone').value);
  let ok = true, first = null;
  const flag = el => { el.classList.add('bad'); ok = false; first = first || el; };
  if (!name) flag($('#cName'));
  if (phone && phone.length !== 10) flag($('#cPhone'));
  const items = [];
  S.items.forEach((it, k) => {
    const card = $(`.item[data-k="${k}"]`);
    const q = num(it.qty) > 0 ? num(it.qty) : 1, c = num(it.cost), s = num(it.sell);
    if (String(it.cost).trim() === '' || c < 0) flag(card.querySelector('[data-f=cost]'));
    if (String(it.sell).trim() === '' || s <= 0) flag(card.querySelector('[data-f=sell]'));
    items.push({item:(it.item || '').trim() || it.category || 'Item', category:it.category || 'Other', qty:q, cost:c, sell:s});
  });
  if (!ok) { toast(phone && phone.length !== 10 ? 'Phone number must be 10 digits' : 'Please fill the highlighted boxes', 'err'); first.focus(); return; }
  const date = $('#cDate').value || today();
  const ed = S.editing;

}

  if (ra) {
    const first = group(findRows(ra.dataset.remindall))[0]; if (!first) return;
    const nm = (first.c || '').trim().toLowerCase();
    const os = group(cache.pending).filter(o => (o.c || '').trim().toLowerCase() === nm);
    const tot = os.reduce((s, o) => s + o.sale, 0);
    const txt = `Hi ${first.c} 😊\nA gentle reminder from *Stylishthread* – payment pending:\n` +
      os.map(o => `• ${o.o} (${fmtD(o.d)}) ${o.items.map(r => r.i).join(', ')} – ${inr(o.sale)}`).join('\n') +
      `\n\n*Total due: ${inr(tot)}*${upiLine()}\nThank you! 🙏`;
    window.open(waLink(os.find(o => o.p)?.p || '', txt), '_blank'); return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return;

/* ================= REPORTS ================= */
function stats(rows) {
  const st = {sale:0, cost:0, qty:0, rcv:0, due:0, cat:new Map(), item:new Map(), cust:new Map(), day:new Map()};
  for (const r of rows) {
    const s = r.q * r.sp, c = r.q * r.cp;
    st.sale += s; st.cost += c; st.qty += r.q; r.pd ? st.rcv += s : st.due += s;
    const g = r.g || 'Other', cg = st.cat.get(g) || {q:0, s:0, p:0}; cg.q += r.q; cg.s += s; cg.p += s - c; st.cat.set(g, cg);
    const ik = (r.i || '').trim(), it = st.item.get(ik) || {q:0, s:0, p:0}; it.q += r.q; it.s += s; it.p += s - c; st.item.set(ik, it);
    const ck = (r.c || '').trim(), cu = st.cust.get(ck) || {s:0, n:new Set()}; cu.s += s; cu.n.add(okey(r)); st.cust.set(ck, cu);
    const dy = st.day.get(r.d) || {s:0, n:new Set()}; dy.s += s; dy.n.add(okey(r)); st.day.set(r.d, dy);
  }
  st.orders = new Set(rows.map(okey)).size;
  return st;
}
function renderReport() {
  const m = S.rMonth, rows = cache.data[m] || [];
  $('#rMonth').innerHTML = monthOptions(m);
  $('#rNote').textContent = cache.ts[m] ? 'Updated ' + new Date(cache.ts[m]).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'}) : (cfg.url ? 'Loading…' : '');
  const st = stats(rows), profit = st.sale - st.cost;
  const margin = st.sale ? Math.round(profit / st.sale * 100) : 0;
  $('#kpis').innerHTML = `
    <div class="kpi hero"><span>Total sales</span><b>${inr0(st.sale)}</b><small>${m}</small></div>
    <div class="kpi"><span>Profit</span><b style="color:var(--ok)">${inr0(profit)}</b><small>${margin}% margin</small></div>
    <div class="kpi"><span>Orders</span><b>${st.orders}</b><small>Avg ${inr0(st.orders ? st.sale / st.orders : 0)} / order</small></div>
    <div class="kpi"><span>Items sold</span><b>${NF.format(st.qty)}</b><small>Cost ${inr0(st.cost)}</small></div>
    <div class="kpi"><span>Received</span><b>${inr0(st.rcv)}</b><small>${st.sale ? Math.round(st.rcv / st.sale * 100) : 0}% collected</small></div>
    <div class="kpi due"><span>Pending</span><b>${inr0(st.due)}</b><small>to collect this month</small></div>
    <div class="kpi"><span>Best day</span><b>${bestDay(st)}</b><small>&nbsp;</small></div>
    <div class="kpi"><span>Top type</span><b style="font-size:17px">${esc(([...st.cat.entries()].sort((a, b) => b[1].s - a[1].s)[0] || ['—'])[0])}</b><small>by sales</small></div>`;
  renderChart(m, st);
  const catRows = [...st.cat.entries()].sort((a, b) => b[1].s - a[1].s);
  $('#cats').innerHTML = catRows.length ? `<table><thead><tr><th>Type</th><th class="n">Qty</th><th class="n">Sales</th><th class="n">Profit</th></tr></thead><tbody>${
    catRows.map(([g, v]) => `<tr><td>${esc(g)}<div class="share" style="width:${Math.max(2, v.s / st.sale * 100)}%"></div></td><td class="n">${NF.format(v.q)}</td><td class="n">${inr0(v.s)}</td><td class="n">${inr0(v.p)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No sales in this month.</div>';
  const dueBy = new Map();
  for (const r of rows) if (!r.pd) { const k = (r.c || '').trim(), v = dueBy.get(k) || {s:0, n:new Set()}; v.s += r.q * r.sp; v.n.add(okey(r)); dueBy.set(k, v); }
  const top = [...dueBy.entries()].sort((a, b) => b[1].s - a[1].s).slice(0, 8);
  $('#topItems').innerHTML = top.length ? `<table><tbody>${top.map(([c, v]) => `<tr><td>${esc(c)}</td><td class="n">${v.n.size} orders</td><td class="n" style="color:var(--due);font-weight:600">${inr0(v.s)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">All payments received 🎉</div>';
  const tc = [...st.cust.entries()].sort((a, b) => b[1].s - a[1].s).slice(0, 6);
  $('#topCust').innerHTML = tc.length ? `<table><tbody>${tc.map(([c, v]) => `<tr><td>${esc(c)}</td><td class="n">${v.n.size} orders</td><td class="n">${inr0(v.s)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">—</div>';
}
function bestDay(st) { const b = [...st.day.entries()].sort((a, b) => b[1].s - a[1].s)[0]; return b ? fmtD(b[0]) : '—'; }
function niceMax(v) { if (v <= 0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function renderChart(m, st) {
  const [mn, y] = m.split(' '), mi = MONTHS.indexOf(mn), days = new Date(+y, mi + 1, 0).getDate();
  const vals = []; for (let d = 1; d <= days; d++) { const key = `${y}-${pad(mi + 1)}-${pad(d)}`, v = st.day.get(key); vals.push({key, d, s:v ? v.s : 0, n:v ? v.n.size : 0}); }
  const max = niceMax(Math.max(...vals.map(v => v.s))), t = today();
  const short = n => n >= 100000 ? '₹' + (n / 100000).toFixed(n % 100000 ? 1 : 0) + 'L' : n >= 1000 ? '₹' + (n / 1000).toFixed(n % 1000 ? 1 : 0) + 'k' : '₹' + n;
  $('#chartSub').textContent = `${st.day.size} selling days`;
  $('#chart').innerHTML = [1, .5, 0].map(f => `<div class="grid-l" style="top:${(1 - f) * 100}%"><span>${short(max * f)}</span></div>`).join('') +
    `<div class="bars">${vals.map(v => `<button class="bar${v.key === t ? ' today' : ''}" data-tip="${v.d} ${mn}: ${inr0(v.s)} · ${v.n} order${v.n === 1 ? '' : 's'}" aria-label="${v.d} ${mn}: ${inr0(v.s)}"><i style="height:${v.s / max * 100}%"></i></button>`).join('')}</div><div class="tip" id="tip"></div>`;
  $('#xl').innerHTML = vals.map(v => `<span>${v.d === 1 || v.d % 5 === 0 ? v.d : ''}</span>`).join('');
}
function showTip(e) {
  const b = e.target.closest('.bar'), tip = $('#tip'); if (!tip) return;
  if (!b) { tip.classList.remove('on'); return; }
  const c = $('#chart').getBoundingClientRect(), r = b.getBoundingClientRect(), bar = b.firstChild.getBoundingClientRect();
  tip.textContent = b.dataset.tip;
  tip.style.left = Math.min(Math.max(r.left + r.width / 2 - c.left, 60), c.width - 60) + 'px';
  tip.style.top = Math.min(bar.top - c.top, c.height - 4) + 'px';
  tip.classList.add('on');
}
$('#chart').addEventListener('pointerover', showTip);
$('#chart').addEventListener('focusin', showTip);
$('#chart').addEventListener('pointerleave', () => { const t = $('#tip'); if (t) t.classList.remove('on'); });
$('#rMonth').onchange = e => { S.rMonth = e.target.value; renderReport(); ensureMonth(S.rMonth); };
$('#shareRep').onclick = () => {
  const m = S.rMonth, st = stats(cache.data[m] || []);
  const topC = [...st.cat.entries()].sort((a, b) => b[1].s - a[1].s).slice(0, 3).map(([g, v]) => `${g} ${inr0(v.s)}`).join(', ');
  const txt = `*Stylishthread – ${m}*\nSales: ${inr0(st.sale)}\nProfit: ${inr0(st.sale - st.cost)}\nOrders: ${st.orders} · Items: ${st.qty}\nReceived: ${inr0(st.rcv)}\nPending: ${inr0(st.due)}\nTop types: ${topC || '—'}`;
  window.open(waLink('', txt), '_blank');
};
$('#csv').onclick = () => {
  const m = S.rMonth, rows = cache.data[m] || [];
  const head = ['Order No','Date','Time','Customer','Phone','Item','Category','Qty','Cost Price','Selling Price','Total Cost','Total Sale','Profit','Paid','Paid On','Notes'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [head.map(q).join(',')].concat(rows.map(r => [r.o, r.d, r.t, r.c, r.p, r.i, r.g, r.q, r.cp, r.sp, r.q * r.cp, r.q * r.sp, r.q * (r.sp - r.cp), r.pd ? 'Yes' : 'No', r.po, r.n].map(q).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type:'text/csv'}));
  a.download = `Stylishthread-${m.replace(' ', '-')}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

/* ================= NAV & BOOT ================= */
function go(v) {
  S.view = v;
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === v));
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  document.body.className = 'v-' + v;
  window.scrollTo(0, 0);
  if (v === 'orders') { renderOrders(); if (S.oMode === 'month') ensureMonth(S.oMonth); }
  if (v === 'report') { renderReport(); ensureMonth(S.rMonth); }
}
$$('.tab').forEach(t => t.onclick = () => go(t.dataset.view));
$('#sync').onclick = () => { flush(); refresh(); if (S.view !== 'sale') { const m = S.view === 'report' ? S.rMonth : S.oMonth; if (m !== curMonth()) loadMonth(m); } };

function renderAll() {
  const dueOrders = group(cache.pending).length;
  $('#dueBadge').textContent = dueOrders ? (dueOrders > 99 ? '99+' : dueOrders) : '';
  renderRecent();
  if (S.view === 'orders') renderOrders();
  if (S.view === 'report') renderReport();
  setSync();
}

window.addEventListener('online', () => { flush(); refresh(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { flush(); const m = curMonth(); if (!cache.ts[m] || Date.now() - cache.ts[m] > 60000) refresh(); }
});

// boot: draw instantly from the saved copy, then sync in the background
$('#cDate').value = today();
mergeUnsynced();
renderItems(); fillDatalists(); renderAll();
if (!cfg.url) setTimeout(() => toast('Not connected: paste your Google Sheet Web App URL in SHEET_URL at the top of index.html', 'warn'), 300);
else { flush(); refresh(); }
</script>
</body>
</html>
